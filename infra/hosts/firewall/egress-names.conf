# Names the host may reach, resolved into the nftables sets of table inet mykey
# by mykey-egress.sh refresh (every 5 minutes, and once at boot before Docker).
# One "purpose name" per line. No IP address, no wildcard. See D-21.

# Let's Encrypt for the edge certificate (set @acme, TCP 443 from mk-pub).
acme acme-v02.api.letsencrypt.org
acme acme-staging-v02.api.letsencrypt.org

# OVHcloud KMS, region us-east-vin (set @kms, TCP 5696 from mk-kms).
kms us-east-vin.okms.ovh.us

# Cloudflare R2, S3 endpoint of the MyKey account (set @r2, TCP 443 from the host).
r2 ddfa208f3f81d98c16e40b9da208c626.r2.cloudflarestorage.com

# The external probe (set @probe, TCP 443 from the host).
probe mykey-probe.nomikey.com

# Ubuntu packages; Docker comes from the Ubuntu archive (set @apt, TCP 80/443 from the host).
# nova.clouds.archive.ubuntu.com is the mirror the OVHcloud image is configured with.
apt nova.clouds.archive.ubuntu.com
apt archive.ubuntu.com
apt security.ubuntu.com

# Docker Hub, filled only during a maintenance window (set @registry, TCP 443).
# Every pinned image in infra/dependencies.lock.json comes from Docker Hub.
registry registry-1.docker.io
registry auth.docker.io
registry production.cloudflare.docker.com
registry production.cloudfront.docker.com
