# TYPE   DATABASE  USER  ADDRESS      METHOD
# TCP: TLS only, SCRAM only. There is no plain "host" line, so a client without
# TLS matches nothing and is refused.
hostssl  all       all   0.0.0.0/0    scram-sha-256
hostssl  all       all   ::/0         scram-sha-256
# Unix socket inside the container (image initialisation and health check).
local    all       all                scram-sha-256
