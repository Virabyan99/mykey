# PostgreSQL settings for the local development and test stack.
listen_addresses = '*'
max_connections = 100
password_encryption = 'scram-sha-256'
hba_file = '/etc/mykey/pg_hba.conf'

# TLS with the development certificate from the pki volume.
ssl = on
ssl_cert_file = '/pki/postgres.crt'
ssl_key_file = '/pki/postgres.key'
ssl_min_protocol_version = 'TLSv1.3'

# As on the hosts (infra/compose/host/postgresql.conf): a statement parameter
# can be a token or a password; none is ever logged.
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
