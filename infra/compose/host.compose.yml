# The MyKey stack on a server (staging and production): edge proxy, API and
# PostgreSQL, and OpenBao where the profile `openbao` is on (Run 2.7). Started by `node scripts/host.ts <host> up`
# with /etc/mykey/host.env as the env file. This file holds no secret.
#
# Rules every service follows (Doc 10 Run 2.5):
#   - image by digest (upstream) or by image ID from host.env (ours)
#   - non-root, read-only root file system, no capabilities, no new privileges
#   - secrets are files under /run/mykey, never environment variables
#   - no service sees the Docker socket; only `edge` publishes a port
#
# Network names and addresses are fixed because the host firewall
# (infra/hosts/firewall/mykey.nft) and the operator tunnels refer to them.
name: mykey

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  # One-shot: writes the host's private CA and the server certificates into
  # /etc/mykey/pki and gives the ACME volume to the edge user. A file that
  # exists is never written again. The only root process, without a network.
  pki-init:
    image: postgres@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    pids_limit: 50
    mem_limit: 128m
    entrypoint: ["sh", "/init/pki-init.sh"]
    environment:
      # uid:gid each consuming service runs as (see `user:` below).
      POSTGRES_KEY_OWNER: "999:999"
      API_KEY_OWNER: "1000:1000"
      EDGE_OWNER: "65532:65532"
      OPENBAO_KEY_OWNER: "100:1000"
    tmpfs:
      - /tmp
    volumes:
      - /etc/mykey/pki:/pki
      - acme:/acme
      - baodata:/baodata
      - baoaudit:/baoaudit
      - ./host/pki-init.sh:/init/pki-init.sh:ro

  postgres:
    <<: *hardening
    image: postgres@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    user: "999:999"
    depends_on:
      pki-init:
        condition: service_completed_successfully
    command: ["postgres", "-c", "config_file=/etc/mykey/postgresql.conf"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/mykey/secrets/superuser-password
    pids_limit: 300
    mem_limit: 2g
    shm_size: 256m
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=999,gid=999,mode=0775
    volumes:
      - pgdata:/var/lib/postgresql
      - /etc/mykey/secrets/postgres:/run/mykey/secrets:ro
      - /etc/mykey/pki/postgres.crt:/pki/postgres.crt:ro
      - /etc/mykey/pki/postgres.key:/pki/postgres.key:ro
      - ./host/postgresql.conf:/etc/mykey/postgresql.conf:ro
      - ./host/pg_hba.conf:/etc/mykey/pg_hba.conf:ro
    networks:
      db:
        ipv4_address: 10.78.2.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h /var/run/postgresql -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 60

  api:
    <<: *hardening
    image: ${API_IMAGE:?load the image first - node scripts/host.ts <host> image api <tar>}
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MYKEY_API_PORT: "8443"
      MYKEY_API_TLS_CERT_FILE: /run/mykey/tls/api.crt
      MYKEY_API_TLS_KEY_FILE: /run/mykey/tls/api.key
      MYKEY_DB_HOST: postgres
      MYKEY_DB_PORT: "5432"
      MYKEY_DB_NAME: postgres
      MYKEY_DB_USER: api_runtime
      MYKEY_DB_PASSWORD_FILE: /run/mykey/secrets/db-password
      MYKEY_DB_CA_FILE: /run/mykey/tls/ca.crt
      # Set in host.env where OpenBao runs (staging from Run 2.7); empty elsewhere,
      # and then /health checks PostgreSQL only.
      MYKEY_BAO_URL: ${MYKEY_BAO_URL:-}
      MYKEY_BAO_CA_FILE: /run/mykey/tls/ca.crt
      # Run 3.1: the service gate (P-43) and the API's own settings. host.ts up
      # writes the host instance id (once) and the base URL into host.env.
      MYKEY_GATE_PATH: /run/mykey/gate/gate.json
      MYKEY_HOST_INSTANCE_ID: ${MYKEY_HOST_INSTANCE_ID:?run node scripts/host.ts <host> up}
      MYKEY_BASE_URL: ${MYKEY_BASE_URL:?run node scripts/host.ts <host> up}
      MYKEY_TRUSTED_PROXY: 10.78.1.2
      # Run 3.2: the auth key rings (host.ts <host> keys init), read-only.
      MYKEY_AUTH_RINGS_DIR: /run/mykey/keys
    pids_limit: 100
    mem_limit: 512m
    tmpfs:
      - /tmp
    volumes:
      - /etc/mykey/secrets/api:/run/mykey/secrets:ro
      - /etc/mykey/pki/api.crt:/run/mykey/tls/api.crt:ro
      - /etc/mykey/pki/api.key:/run/mykey/tls/api.key:ro
      - /etc/mykey/pki/ca.crt:/run/mykey/tls/ca.crt:ro
      - /etc/mykey/gate:/run/mykey/gate:ro
      - /etc/mykey/secrets/api-keys:/run/mykey/keys:ro
    networks:
      edge:
        ipv4_address: 10.78.1.3
      db:
        ipv4_address: 10.78.2.3
      bao:
        ipv4_address: 10.78.3.3

  # OpenBao on the OVHcloud KMS seal (Run 2.7, D-23). Only with the profile
  # `openbao` (host.ts up adds it where host.env says MYKEY_OPENBAO=1):
  # production holds no OpenBao in Session 2. Its configuration is rendered by
  # host.ts from host/openbao.hcl.tmpl into /etc/mykey/openbao. When the KMS
  # cannot be reached at start the process exits; the restart policy retries.
  openbao:
    <<: *hardening
    profiles: [openbao]
    image: openbao/openbao@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    user: "100:1000"
    depends_on:
      pki-init:
        condition: service_completed_successfully
    command: ["bao", "server", "-config=/openbao/config/openbao.hcl"]
    environment:
      SKIP_CHOWN: "true"
      SKIP_SETCAP: "true"
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /openbao/tls/ca.crt
    pids_limit: 200
    mem_limit: 1g
    tmpfs:
      - /tmp
    volumes:
      - baodata:/openbao/file
      - baoaudit:/openbao/audit
      - /etc/mykey/openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
      - /etc/mykey/pki/openbao.crt:/openbao/tls/server.crt:ro
      - /etc/mykey/pki/openbao.key:/openbao/tls/server.key:ro
      - /etc/mykey/pki/ca.crt:/openbao/tls/ca.crt:ro
      - /etc/mykey/secrets/kms:/openbao/kms:ro
    networks:
      bao:
        ipv4_address: 10.78.3.2
      kms:
        ipv4_address: 10.78.4.2

  # The provisioner (Run 3.8, P-55): the only writer of machine policies and
  # token roles, and the drift sweep. Profile `openbao` only. No published
  # port and no route out: it reaches PostgreSQL and OpenBao on their bridges.
  # Its credential (provisioner role id and secret id, delivered by
  # `ops provision-organization`) and its database password are files.
  provisioner:
    <<: *hardening
    profiles: [openbao]
    image: ${PROVISIONER_IMAGE:?load the image first - node scripts/host.ts <host> image provisioner <tar>}
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
      openbao:
        condition: service_started
    environment:
      MYKEY_DB_HOST: postgres
      MYKEY_DB_PORT: "5432"
      MYKEY_DB_NAME: postgres
      MYKEY_DB_USER: provisioner_runtime
      MYKEY_DB_PASSWORD_FILE: /run/mykey/secrets/db-password
      MYKEY_DB_CA_FILE: /run/mykey/tls/ca.crt
      # The name in OpenBao's certificate, as the API uses it (host.env).
      MYKEY_BAO_URL: ${MYKEY_BAO_URL:?set in /etc/mykey/host.env}
      MYKEY_BAO_CA_FILE: /run/mykey/tls/ca.crt
      MYKEY_PROVISIONER_CREDENTIALS_DIR: /run/mykey/secrets
      MYKEY_GATE_PATH: /run/mykey/gate/gate.json
      MYKEY_HOST_INSTANCE_ID: ${MYKEY_HOST_INSTANCE_ID:?run node scripts/host.ts <host> up}
      MYKEY_SWEEP_SECONDS: ${MYKEY_SWEEP_SECONDS:-300}
      MYKEY_PROVISIONER_STATE_FILE: /tmp/mykey-provisioner/last-sweep
    pids_limit: 100
    mem_limit: 256m
    tmpfs:
      - /tmp
    volumes:
      - /etc/mykey/secrets/provisioner:/run/mykey/secrets:ro
      - /etc/mykey/pki/ca.crt:/run/mykey/tls/ca.crt:ro
      - /etc/mykey/gate:/run/mykey/gate:ro
    networks:
      db:
        ipv4_address: 10.78.2.4
      bao:
        ipv4_address: 10.78.3.4

  # Traefik. Its static configuration is given as flags because a static file
  # cannot take the ACME directory from host.env, and Traefik does not merge a
  # file with flags. Routers, TLS options and the upstream are in the dynamic
  # file. No Docker provider, no dashboard, no API.
  edge:
    <<: *hardening
    image: traefik@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
    user: "65532:65532"
    depends_on:
      pki-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      - --accesslog=true
      - --entrypoints.websecure.address=:8443
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=false
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.caserver=${MYKEY_ACME_DIRECTORY:?set in /etc/mykey/host.env}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
    environment:
      MYKEY_HOSTNAME: ${MYKEY_HOSTNAME:?set in /etc/mykey/host.env}
    pids_limit: 100
    mem_limit: 256m
    tmpfs:
      - /tmp
    volumes:
      - acme:/acme
      - ./host/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /etc/mykey/pki/ca.crt:/pki/ca.crt:ro
    ports:
      - "0.0.0.0:443:8443"
    networks:
      pub:
        ipv4_address: 10.78.0.2
      edge:
        ipv4_address: 10.78.1.2

networks:
  pub:
    driver_opts:
      com.docker.network.bridge.name: mk-pub
    enable_ipv6: false
    ipam:
      config:
        - subnet: 10.78.0.0/28
  edge:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: mk-edge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 10.78.1.0/28
  db:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: mk-db
    enable_ipv6: false
    ipam:
      config:
        - subnet: 10.78.2.0/28
  bao:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: mk-bao
    enable_ipv6: false
    ipam:
      config:
        - subnet: 10.78.3.0/28
  # OpenBao's way to the KMS: the firewall lets this bridge reach the set
  # `kms` on 5696 and the resolver, nothing else.
  kms:
    driver_opts:
      com.docker.network.bridge.name: mk-kms
    enable_ipv6: false
    ipam:
      config:
        - subnet: 10.78.4.0/28

volumes:
  pgdata:
  acme:
  baodata:
  baoaudit:
