# Who may connect to PostgreSQL on a MyKey server.
#
# The socket inside the container: used by the image's first-start script and
# the health check. A password is still required.
local    all  all                 scram-sha-256
# The database network (API, later the provisioner, and the operator's SSH
# tunnel, which arrives from the bridge address): TLS and a password.
hostssl  all  all  10.78.2.0/28   scram-sha-256
# Everything else, including any connection without TLS.
host     all  all  all            reject
