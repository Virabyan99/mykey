# PostgreSQL on a MyKey server. Settings not listed keep the image defaults.
listen_addresses = '*'
# LIMITS.db.maxConnections in @mykey/contracts; a test keeps the two equal.
max_connections = 100
password_encryption = 'scram-sha-256'
hba_file = '/etc/mykey/pg_hba.conf'

ssl = on
ssl_cert_file = '/pki/postgres.crt'
ssl_key_file = '/pki/postgres.key'
ssl_min_protocol_version = 'TLSv1.3'

# A statement parameter can be a secret-adjacent value; none is ever logged.
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
