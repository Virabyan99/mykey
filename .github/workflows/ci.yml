name: ci

# Actions minutes are scarce on this private repository (2,000 a month), so CI
# runs only on pull requests and by hand, never on a plain push. Every run on a
# working branch is preceded by the local `pnpm run check` and test runs.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      jobs:
        description: "all, or cli-matrix alone"
        type: choice
        options: [all, cli-matrix]
        default: all
      cli_release:
        description: "the release tag cli-matrix tests (cli-v<version>)"
        type: string
        default: ""

permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned by commit SHA and every container image by digest;
# both come from infra/dependencies.lock.json and are checked by pins:verify.

jobs:
  # check and the unit tests share one job (one install, one rounded minute).
  # It also decides whether anything besides documentation changed; the
  # integration suite and the scans wait for it, so a red check costs no more.
  # A `jobs=cli-matrix` dispatch runs nothing but cli-matrix: check and
  # secret-scan stay out, and the jobs that need check are skipped with it.
  check:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs != 'cli-matrix'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Documentation only = every changed path is under docs/ or ends in .md,
      # except the dotenv runbook, whose table an integration test checks.
      # A manual run, or a base that cannot be found, runs everything.
      - id: diff
        name: Did anything besides documentation change?
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$PR_BASE" ] || ! git cat-file -e "$PR_BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$PR_BASE" HEAD)"
          if printf '%s\n' "$changed" | grep -qvE '^docs/|\.md$|^$' \
            || printf '%s\n' "$changed" | grep -qx 'docs/runbooks/dotenv-format-v1.md'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The typed lint of the whole repository outgrew Node's default heap
      # (about 2 GB) in Session 3; the runner has 16 GB.
      - run: pnpm run check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pnpm test

  # Always runs: a value pasted into a document is still a leak.
  secret-scan:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs != 'cli-matrix'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: gitleaks over the full history
        run: node scripts/ci-scan.ts secrets

  # The dependency and image scans and the scanners' self-test, in one job.
  scans:
    needs: check
    if: needs.check.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Trivy over the lock files (HIGH and CRITICAL with a fix)
        run: node scripts/ci-scan.ts dependencies
      - name: Trivy over the pinned runtime images
        if: ${{ !cancelled() }}
        run: node scripts/ci-scan.ts images
      - name: Both scanners must find their seeded fixture
        if: ${{ !cancelled() }}
        run: node scripts/ci-scan.ts selftest

  integration:
    needs: check
    if: needs.check.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Two shards by file (Run 4.9): the whole suite outgrew 30 minutes on one runner.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # The dotenv loader test runs the pinned python-dotenv next to @next/env.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:integration --shard="$SHARD/2"
        env:
          SHARD: ${{ matrix.shard }}
      - name: Remove every test stack
        if: always()
        run: node scripts/stack.ts down --all

  # Manual runs only, once at a gate that changed the CLI: macOS minutes count
  # ten times on a private repository (planner decisions P-7, P-99).
  #   gh workflow run ci --ref <branch> -f jobs=cli-matrix -f cli_release=cli-v<version>
  # It tests the released files, not this checkout's build: the release is
  # downloaded, its SHA256SUMS checked, install.sh run, and project `cli` runs
  # with MYKEY_CLI_BIN = the installed launcher. The job's own Node runs only
  # Vitest; every CLI process of the suite runs on the installer's Node.
  cli-matrix:
    if: github.event_name == 'workflow_dispatch' && inputs.cli_release != ''
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      MYKEY_EXPECT_TARGET: ${{ matrix.target }}
      TAG: ${{ inputs.cli_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir rel
      - name: Verify SHA256SUMS
        working-directory: rel
        run: |
          cat SHA256SUMS
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
      - name: Install with install.sh
        run: sh rel/install.sh
      - name: The system and the installed launcher
        run: |
          uname -a
          "$HOME/.local/bin/secrets" --version
      - name: Project cli against the installed launcher
        run: |
          MYKEY_CLI_BIN="$HOME/.local/bin/secrets" MYKEY_RELEASE_DIR="$GITHUB_WORKSPACE/rel" \
            pnpm exec vitest run --project cli --reporter=default --reporter=json \
            --outputFile.json="cli-report-$MYKEY_EXPECT_TARGET.json"
      - name: Upload the JSON report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-report-${{ matrix.target }}
          path: cli-report-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30
